# Match the working VM settings (see ~/TOOLS.md): force IPv4 (this VM's JVM
# times out over IPv6) and give the daemon real memory.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Stack=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
